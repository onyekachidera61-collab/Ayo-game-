<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile – 9jaWin Ayo</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar">
  <a class="navbar-brand" href="/">🎮 9jaWin</a>
  <button class="navbar-menu-toggle">☰</button>
  <ul class="navbar-nav">
    <li><a href="/lobby.html">Lobby</a></li>
    <li><a href="/leaderboard.html">Leaderboard</a></li>
    <li><a href="/wallet.html">💰 Wallet</a></li>
    <li><a href="/profile.html" class="active">👤 Profile</a></li>
    <li><a href="#" id="logout-btn" class="btn btn-ghost btn-sm">Logout</a></li>
  </ul>
</nav>

<main class="container" style="padding:2rem 1rem;max-width:800px">
  <div id="profile-loading"><div class="spinner"></div></div>
  <div id="profile-ui" class="hidden">

    <!-- Profile Header -->
    <div class="card mb-2" style="display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap">
      <div style="position:relative">
        <div class="player-avatar" id="avatar-display"
             style="width:80px;height:80px;font-size:2rem;border:3px solid var(--accent)">
          ?
        </div>
        <button onclick="document.getElementById('avatar-input').click()"
                style="position:absolute;bottom:0;right:0;background:var(--accent);color:#000;border:none;border-radius:50%;width:24px;height:24px;font-size:0.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center">
          ✏️
        </button>
        <input type="file" id="avatar-input" accept="image/*" style="display:none" onchange="uploadAvatar(this)">
      </div>
      <div style="flex:1">
        <h2 id="display-name-display">Loading…</h2>
        <p class="text-muted text-sm" id="username-display"></p>
        <p class="text-sm mt-1" id="bio-display"></p>
        <button class="btn btn-ghost btn-sm mt-1" onclick="openEditModal()">✏️ Edit Profile</button>
      </div>
    </div>

    <!-- Stats Grid -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem;margin-bottom:1.5rem">
      <div class="stat-card">
        <div class="stat-value" id="stat-played">0</div>
        <div class="stat-label">Games Played</div>
      </div>
      <div class="stat-card">
        <div class="stat-value text-success" id="stat-won">0</div>
        <div class="stat-label">Games Won</div>
      </div>
      <div class="stat-card">
        <div class="stat-value text-accent" id="stat-rate">0%</div>
        <div class="stat-label">Win Rate</div>
      </div>
      <div class="stat-card">
        <div class="stat-value text-accent" id="stat-earnings">₦0</div>
        <div class="stat-label">Total Earnings</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-streak">0</div>
        <div class="stat-label">Best Streak</div>
      </div>
      <div class="stat-card">
        <div class="stat-value text-success" id="stat-balance">₦0</div>
        <div class="stat-label">Balance</div>
      </div>
    </div>

    <!-- Match History -->
    <div class="card">
      <h3 style="margin-bottom:1rem">Recent Matches</h3>
      <div id="history-list"><div class="spinner"></div></div>
    </div>
  </div>
</main>

<!-- Edit Modal -->
<div id="edit-modal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem">
  <div class="card" style="width:100%;max-width:420px">
    <h3 style="margin-bottom:1.5rem">Edit Profile</h3>
    <form id="edit-form">
      <div class="form-group">
        <label class="form-label">Display Name</label>
        <input type="text" id="edit-display-name" class="form-input" maxlength="100">
      </div>
      <div class="form-group">
        <label class="form-label">Bio</label>
        <textarea id="edit-bio" class="form-input" rows="3" maxlength="500" placeholder="Tell us about yourself…"></textarea>
      </div>
      <div style="display:flex;gap:1rem;margin-top:1.5rem">
        <button type="submit" class="btn btn-primary" style="flex:1">Save</button>
        <button type="button" class="btn btn-ghost" onclick="closeModal('edit-modal')">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  requireAuth();

  let userData = null;

  async function loadProfile() {
    const res = await AyoAPI.getMe();
    if (!res.success) { Toast.error('Failed to load profile.'); return; }

    userData = res.data;
    document.getElementById('profile-loading').classList.add('hidden');
    document.getElementById('profile-ui').classList.remove('hidden');

    document.getElementById('display-name-display').textContent = userData.display_name || userData.username;
    document.getElementById('username-display').textContent = '@' + userData.username;
    document.getElementById('bio-display').textContent = userData.bio || 'No bio set.';

    const avatarEl = document.getElementById('avatar-display');
    if (userData.avatar) {
      avatarEl.innerHTML = `<img src="${userData.avatar}" alt="" style="width:100%;height:100%;object-fit:cover">`;
    } else {
      avatarEl.textContent = userData.username[0].toUpperCase();
    }

    const played  = userData.games_played || 0;
    const won     = userData.games_won    || 0;
    const winRate = played > 0 ? Math.round((won / played) * 100) : 0;

    document.getElementById('stat-played').textContent   = played;
    document.getElementById('stat-won').textContent      = won;
    document.getElementById('stat-rate').textContent     = winRate + '%';
    document.getElementById('stat-earnings').textContent = formatCurrency(userData.total_earnings || 0);
    document.getElementById('stat-streak').textContent   = userData.best_streak || 0;
    document.getElementById('stat-balance').textContent  = formatCurrency(userData.balance || 0);

    loadHistory();
  }

  async function loadHistory() {
    const el = document.getElementById('history-list');
    const res = await AyoAPI.getUserHistory(userData.id);
    if (!res.success) { el.innerHTML = '<p class="text-muted">Failed to load history.</p>'; return; }

    if (!res.data.length) {
      el.innerHTML = '<p class="text-muted text-center p-3">No matches played yet. <a href="/lobby.html">Play now!</a></p>';
      return;
    }

    el.innerHTML = `
      <div class="table-wrapper">
        <table>
          <thead><tr><th>Opponent</th><th>Type</th><th>Result</th><th>Entry</th><th>Date</th></tr></thead>
          <tbody>
            ${res.data.map(m => `
              <tr>
                <td><strong>${m.opponent_username}</strong></td>
                <td><span class="room-type-badge badge-${m.type}">${m.type}</span></td>
                <td class="text-${m.result === 'win' ? 'success' : m.result === 'draw' ? 'warning' : 'danger'}">
                  ${m.result === 'win' ? '🏆 Win' : m.result === 'draw' ? '🤝 Draw' : '😔 Loss'}
                </td>
                <td>${m.entry_fee > 0 ? formatCurrency(m.entry_fee) : '—'}</td>
                <td>${formatDate(m.completed_at)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  function openEditModal() {
    document.getElementById('edit-display-name').value = userData.display_name || '';
    document.getElementById('edit-bio').value = userData.bio || '';
    const modal = document.getElementById('edit-modal');
    modal.classList.remove('hidden');
    modal.style.display = 'flex';
  }

  document.getElementById('edit-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const res = await AyoAPI.updateMe({
      display_name: document.getElementById('edit-display-name').value,
      bio:          document.getElementById('edit-bio').value,
    });
    if (res.success) {
      Toast.success('Profile updated!');
      closeModal('edit-modal');
      loadProfile();
    } else {
      Toast.error(res.message || 'Update failed.');
    }
  });

  async function uploadAvatar(input) {
    if (!input.files.length) return;
    const file = input.files[0];
    const formData = new FormData();
    formData.append('avatar', file);

    const res = await fetch('/api/users/me/avatar', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + AyoAPI.getToken() },
      body: formData,
    });
    const data = await res.json();
    if (data.success) {
      Toast.success('Avatar updated!');
      loadProfile();
    } else {
      Toast.error(data.message || 'Upload failed.');
    }
  }

  function closeModal(id) {
    const el = document.getElementById(id);
    el.classList.add('hidden');
    el.style.display = 'none';
  }

  document.getElementById('edit-modal').addEventListener('click', e => {
    if (e.target.id === 'edit-modal') closeModal('edit-modal');
  });

  document.getElementById('logout-btn').addEventListener('click', async e => {
    e.preventDefault();
    await AyoAPI.logout();
    window.location.href = '/login.html';
  });

  loadProfile();
</script>
</body>
</html>
