version: '3.9'

services:
  app:
    build: .
    container_name: 9jawin-ayo-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      CLIENT_URL: http://localhost:3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: 9jawin
      DB_PASSWORD: ${DB_PASSWORD:-9jawin_secret_change_me}
      DB_NAME: 9jawin_ayo
      JWT_SECRET: ${JWT_SECRET:-change_this_jwt_secret_minimum_32_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_refresh_secret_min_32_chars}
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 7d
      UPLOAD_PATH: /app/uploads/avatars
      MONEY_MATCH_FEE_PERCENT: 20
      TOURNAMENT_FEE_PERCENT: 30
      TURN_TIMER_SECONDS: 30
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - 9jawin-net

  db:
    image: mysql:8.0
    container_name: 9jawin-ayo-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret_change_me}
      MYSQL_DATABASE: 9jawin_ayo
      MYSQL_USER: 9jawin
      MYSQL_PASSWORD: ${DB_PASSWORD:-9jawin_secret_change_me}
    volumes:
      - db-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "9jawin", "-p${DB_PASSWORD:-9jawin_secret_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - 9jawin-net

  # Optional: Redis for caching (future use)
  # redis:
  #   image: redis:7-alpine
  #   container_name: 9jawin-redis
  #   restart: unless-stopped
  #   networks:
  #     - 9jawin-net

volumes:
  db-data:
  uploads:

networks:
  9jawin-net:
    driver: bridge
